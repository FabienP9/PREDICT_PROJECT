# This GitHub actions workflow is intended to run main in test production environment
# It gets secrets variables, install rclone to interact with dropbox, install dependencies, run python program
# and send an email to report success or failure with output_need dataframe, check string and next run timestamp values
name: Run main [Prod - manual output_need]

concurrency:
  group: predict-run
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: self-hosted
    env:
      IS_TESTRUN: 0 
      IS_OUTPUT_AUTO: 0
      OVERWRITE_GAMES_STATUS: 0
      BI_URL: ${{ secrets.BI_URL }}
      BI_USERNAME: ${{ secrets.BI_USERNAME }}
      BI_PASSWORD: ${{ secrets.BI_PASSWORD }}
      SH_URL: ${{ secrets.SH_URL }}
      SH_USERNAME: ${{ secrets.SH_USERNAME }}
      SH_PASSWORD: ${{ secrets.SH_PASSWORD }}
      SH_API_KEY: ${{ secrets.SH_API_KEY }}
      SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      LNB_URL: ${{ secrets.LNB_URL }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify rclone installation
        id: verify_rclone
        run: |
          command -v rclone
          rclone version
          
      - name: Configure rclone 
        run: | 
          mkdir -p ~/.config/rclone 
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Send Email if setup or pre-run steps fail
        if: ${{ failure() }}
        run: |
          python3 - <<EOF
          import os, smtplib
          from email.message import EmailMessage

          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          
          msg = EmailMessage()
          msg['Subject'] = f'[PREDICT] Prerun Failed - Main Prod | manual'
          msg.set_content(f"An error occurred before running main.\n\nCheck logs: {run_url}")
          msg['From'] = os.environ["GMAIL_USER"]
          msg['To'] = os.environ["RECIPIENT_EMAIL"]

          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(os.environ["GMAIL_USER"],os.environ["GMAIL_APP_PASSWORD"])
              server.send_message(msg)
          EOF

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ".[prod]"

      - name: Run Python script
        run: |
          set -e
          # exit if error at any moment
          python3 -m src.predict_core.entry_point.main

      - name: Send Email (Success or Failure)
        if: always()
        run: |
          python3 - <<EOF
          import os, smtplib, json, pathlib, base64
          from email.message import EmailMessage

          status = "${{ job.status }}"
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          
          msg = EmailMessage()
          p = pathlib.Path("json_file_email_details.json")
          output_data = json.loads(p.read_text()) if p.exists() else {"Status of run": "S.NoDetails", "TASK_RUN": "T.NoDetails"}

          rows = "".join(
              f"<p><u>{key}</u>: {value}</p>"
              for key, value in output_data.items()
          )

          msg["Subject"] = f"[PREDICT] {output_data.get('Status of run', 'S.Undefined')} - {output_data.get('TASK_RUN', 'T.Undefined')} - Main Prod | manual"
          msg.add_alternative(f"""
              <html>
                <body>
                  {rows}
                  <p><u>Logs</u>: {run_url}</p>
                </body>
              </html>
              """, subtype="html")

          msg['From'] = os.environ["GMAIL_USER"]
          msg['To'] = os.environ["RECIPIENT_EMAIL"]
          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.starttls()
              server.login(os.environ["GMAIL_USER"],os.environ["GMAIL_APP_PASSWORD"])
              server.send_message(msg)
          EOF
